name: Payment Event Durability

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  payment-event-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Install backend dependencies from lockfile
        run: npm ci


      - name: Run PaymentEvent durability and financial regressions on disposable replica set
        run: |
          npm run test:db -- test/payment-event-durability.integration.test.js test/refund-event-durability.integration.test.js test/payment-correlation.integration.test.js test/payment-transitions.integration.test.js test/refund-contract.integration.test.js test/refund-retry-semantics.integration.test.js test/refund-admin-visibility.integration.test.js test/settlement-payment-safety.integration.test.js test/settlement-ledger.integration.test.js test/customer-cancellation.integration.test.js test/customer-platform-pause-payment.integration.test.js test/customer-payment-dto.integration.test.js test/customer-pricing-truth.integration.test.js test/customer-ticket-lifecycle.integration.test.js test/admin-payment-operations.integration.test.js test/admin-booking-support.integration.test.js test/database-backup-restore.integration.test.js
