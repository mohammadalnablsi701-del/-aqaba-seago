name: Payment Correlation Hardening

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  payment-correlation-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Install backend dependencies from lockfile
        run: npm ci

      - name: Install isolated MongoDB test runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund

      - name: Run payment correlation, crash recovery and financial regressions on disposable replica set
        run: |
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              const child=spawn(process.execPath,[
                '--test',
                'test/payment-correlation.integration.test.js',
                'test/payment-transitions.integration.test.js',
                'test/checkout-capacity.integration.test.js',
                'test/customer-platform-pause-payment.integration.test.js',
                'test/customer-payment-dto.integration.test.js',
                'test/customer-pricing-truth.integration.test.js',
                'test/customer-ticket-lifecycle.integration.test.js',
                'test/customer-cancellation.integration.test.js',
                'test/admin-payment-operations.integration.test.js',
                'test/admin-booking-support.integration.test.js',
                'test/settlement-ledger.integration.test.js'
              ],{
                env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},
                stdio:'inherit'
              });
              code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
            }finally{
              await db.stop();
            }
            process.exit(code??1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
