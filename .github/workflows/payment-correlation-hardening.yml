name: Payment Correlation Hardening

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  payment-correlation-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Install backend dependencies from lockfile
        run: npm ci


      - name: Run payment correlation, crash recovery and financial regressions on disposable replica set
        run: |
          npm run test:db -- test/payment-correlation.integration.test.js test/payment-transitions.integration.test.js test/checkout-capacity.integration.test.js test/customer-platform-pause-payment.integration.test.js test/customer-payment-dto.integration.test.js test/customer-pricing-truth.integration.test.js test/customer-ticket-lifecycle.integration.test.js test/customer-cancellation.integration.test.js test/admin-payment-operations.integration.test.js test/admin-booking-support.integration.test.js test/settlement-ledger.integration.test.js
