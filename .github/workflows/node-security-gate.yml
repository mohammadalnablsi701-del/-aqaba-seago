name: Node Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-node-22-23-4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup patched Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify exact runtime and lockfile contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.4"
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.engines?.node !== '22.23.4') throw new Error(`package.json engines.node=${pkg.engines?.node}`);
          if (lock.packages?.['']?.engines?.node !== '22.23.4') throw new Error(`lockfile engines.node=${lock.packages?.['']?.engines?.node}`);
          if (lock.packages?.['node_modules/body-parser']?.version !== '1.20.9') throw new Error('body-parser security fix missing');
          if (lock.packages?.['node_modules/ip-address']?.version !== '10.7.5') throw new Error('ip-address security fix missing');
          console.log('Production Node/security contract verified');
          NODE

      - name: Install backend dependencies from lockfile
        run: npm ci --no-fund

      - name: Prove backend lockfile remains stable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Run backend tests on Node 22.23.4
        run: npm test

      - name: Install isolated MongoDB integration runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund

      - name: Run critical integration tests on disposable MongoDB
        run: |
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              const child=spawn(process.execPath,[
                '--test',
                'test/payment-transitions.integration.test.js',
                'test/checkout-capacity.integration.test.js',
                'test/ticket-checkin.integration.test.js',
                'test/customer-ticket-lifecycle.integration.test.js',
                'test/customer-cancellation.integration.test.js',
                'test/settlement-ledger.integration.test.js',
                'test/provider-role-permissions.integration.test.js',
                'test/provider-sales-control.integration.test.js',
                'test/admin-sellability-semantics.integration.test.js',
                'test/admin-sensitive-actions.integration.test.js',
                'test/admin-operations.integration.test.js',
                'test/admin-payment-operations.integration.test.js',
                'test/provider-access-admin.integration.test.js',
                'test/pilot-booking-ticket.e2e.test.js',
                'test/password-recovery.integration.test.js',
                'test/database-backup-restore.integration.test.js',
                'test/android-fcm.integration.test.js'
              ],{env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},stdio:'inherit'});
              code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
            } finally {
              await db.stop();
            }
            process.exit(code??1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Reject High or Critical dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          audit_rc=0
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_rc=$?
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const v=x.metadata?.vulnerabilities||{};console.log("npm audit severities:",JSON.stringify(v));if((v.critical||0)>0||(v.high||0)>0)process.exit(1)' "$RUNNER_TEMP/npm-audit.json"
          if [ "$audit_rc" -ne 0 ]; then
            echo "npm audit returned $audit_rc; accepted only because no High/Critical advisories remain"
          fi
