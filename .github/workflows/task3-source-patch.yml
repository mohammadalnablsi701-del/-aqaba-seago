name: Task 3 source patch

on:
  push:
    branches:
      - feature/final-hardening-task3-settlement-payment-safety

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[task3-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source patch
        run: node scripts/apply-task3-source-patch.mjs
      - name: Remove one-shot patch files
        run: git rm scripts/apply-task3-source-patch.mjs .github/workflows/task3-source-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Harden settlement admin UX and remove legacy routes [task3-patch-applied]"
          git push
