name: Customer Pricing Truth

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  customer-pricing-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Run customer pricing truth unit regressions
        run: node --test test/customer-pricing-truth.test.js
      - name: Install backend dependencies from lockfile
        run: npm ci
      - name: Run checkout repricing and booking snapshot regression
        run: |
          npm run test:db -- test/customer-pricing-truth.integration.test.js
