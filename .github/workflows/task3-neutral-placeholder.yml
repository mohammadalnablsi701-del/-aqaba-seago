name: Task 3 neutral vessel placeholder

on:
  push:
    branches: [fix/provider-neutral-vessel-placeholder]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-neutral-vessel-placeholder
          fetch-depth: 0
      - name: Replace competitor example with neutral placeholder
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('provider-app/src/App.jsx')
          s = p.read_text()
          old = 'placeholder="Example: Sea Breeze"'
          new = 'placeholder="Enter vessel / boat name"'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one vessel placeholder, found {count}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -F 'placeholder="Enter vessel / boat name"' provider-app/src/App.jsx
          if grep -Fq 'placeholder="Example: Sea Breeze"' provider-app/src/App.jsx; then exit 1; fi
      - name: Build provider app
        working-directory: provider-app
        run: npm install --no-fund && npm run build
      - name: Commit focused UI copy change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/task3-neutral-placeholder.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-app/src/App.jsx .github/workflows/task3-neutral-placeholder.yml
          git commit -m "Use neutral vessel placeholder"
          git push origin HEAD:fix/provider-neutral-vessel-placeholder
