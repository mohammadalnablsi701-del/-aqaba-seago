name: Android Release Bundle

on:
  push:
    branches: [main]
    paths:
      - "customer-app/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: customer-app
        run: npm install --no-fund

      - name: Build web app
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Create Android project
        working-directory: customer-app
        run: npx cap add android

      - name: Render native brand sources
        working-directory: customer-app
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/logo.svg -o assets/icon-only.png
          rsvg-convert -w 2732 -h 2732 assets/splash.svg -o assets/splash.png

      - name: Generate branded Android assets
        working-directory: customer-app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#071F33' --iconBackgroundColorDark '#071F33' --splashBackgroundColor '#071F33' --splashBackgroundColorDark '#071F33'

      - name: Sync Android project
        working-directory: customer-app
        run: npx cap sync android

      - name: Configure release identity
        working-directory: customer-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          text = re.sub(r'versionCode\s+\d+', 'versionCode 1', text)
          text = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.0.0"', text)
          gradle.write_text(text)
          PY

      - name: Build unsigned release bundle
        working-directory: customer-app/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Write release metadata
        run: |
          cat > customer-app/android/release-info.json <<EOF
          {
            "appName": "Aqaba SeaGo",
            "applicationId": "com.aqabaseago.app",
            "versionName": "1.0.0",
            "versionCode": 1,
            "commit": "${GITHUB_SHA}",
            "signed": false
          }
          EOF

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: aqaba-seago-android-release-unsigned
          path: |
            customer-app/android/app/build/outputs/bundle/release/app-release.aab
            customer-app/android/release-info.json
          if-no-files-found: error
          retention-days: 14
