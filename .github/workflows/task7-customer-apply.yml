name: Task 7 Customer Apply

on:
  push:
    branches: ["phase1/task7-customer-reproducible-build"]
    paths:
      - ".github/workflows/task7-customer-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase1/task7-customer-reproducible-build

      - name: Patch release workflows without changing business code
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          text = replace_once(
              text,
              '      - name: Audit customer app dependencies\n        working-directory: customer-app\n        run: npm install --no-fund && npm audit --audit-level=high\n',
              '      - name: Audit customer app dependencies from lockfile\n        working-directory: customer-app\n        run: npm ci --no-fund && npm audit --audit-level=high\n',
              'customer dependency audit',
          )
          start = text.index('  customer-app-build:\n')
          end = text.index('  provider-app-build:\n', start)
          customer_job = '''  customer-app-build:
            runs-on: ubuntu-latest
            timeout-minutes: 10
            steps:
              - name: Checkout
                uses: actions/checkout@v4

              - name: Setup Node 22
                uses: actions/setup-node@v4
                with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: customer-app/package-lock.json

              - name: Install Customer dependencies from lockfile
                working-directory: customer-app
                run: npm ci --no-fund

              - name: Verify Customer source has no hardcoded deployed API
                working-directory: customer-app
                shell: bash
                run: |
                  set -euo pipefail
                  if grep -RInE --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --include='*.html' --include='*.json' --include='*.webmanifest' 'https?://[^[:space:]"'"']*onrender\\.com' src public index.html capacitor.config.ts; then
                    echo "Hardcoded deployed API URL found in Customer source"
                    exit 1
                  fi

              - name: Prove missing Staging API is rejected
                working-directory: customer-app
                shell: bash
                env:
                  VITE_API_BASE_URL: ""
                run: |
                  set -euo pipefail
                  rm -rf dist
                  npm run build
                  if node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api-staging.onrender.com" --forbidden="https://aqaba-seago-api.onrender.com" --base="/-aqaba-seago/" --label="Staging missing env"; then
                    echo "Missing Staging environment was incorrectly accepted"
                    exit 1
                  fi
                  echo "Missing Staging environment rejected as expected"

              - name: Build and verify Staging Customer artifact
                working-directory: customer-app
                env:
                  VITE_API_BASE_URL: https://aqaba-seago-api-staging.onrender.com
                run: |
                  set -euo pipefail
                  rm -rf dist
                  npm run build
                  node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api-staging.onrender.com" --forbidden="https://aqaba-seago-api.onrender.com" --base="/-aqaba-seago/" --label="Staging"
                  rm -rf "$RUNNER_TEMP/customer-staging"
                  cp -R dist "$RUNNER_TEMP/customer-staging"

              - name: Build and verify Production Customer artifact
                working-directory: customer-app
                env:
                  VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
                run: |
                  set -euo pipefail
                  rm -rf dist
                  npm run build
                  node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Production first build"
                  (cd dist && find assets -type f \\( -name '*.js' -o -name '*.css' \\) -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/customer-prod-1.sha256"
                  rm -rf "$RUNNER_TEMP/customer-production"
                  cp -R dist "$RUNNER_TEMP/customer-production"

              - name: Rebuild Production Customer from a second clean install
                working-directory: customer-app
                env:
                  VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
                run: |
                  set -euo pipefail
                  rm -rf node_modules dist
                  npm ci --no-fund
                  npm run build
                  node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Production second clean build"
                  (cd dist && find assets -type f \\( -name '*.js' -o -name '*.css' \\) -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/customer-prod-2.sha256"
                  diff -u "$RUNNER_TEMP/customer-prod-1.sha256" "$RUNNER_TEMP/customer-prod-2.sha256"
                  echo "Customer production JS/CSS hashes are deterministic:"
                  cat "$RUNNER_TEMP/customer-prod-2.sha256"

              - name: Upload Customer Staging artifact
                uses: actions/upload-artifact@v4
                with:
                  name: customer-staging-${{ github.sha }}
                  path: ${{ runner.temp }}/customer-staging
                  if-no-files-found: error
                  retention-days: 7

              - name: Upload Customer Production artifact
                uses: actions/upload-artifact@v4
                with:
                  name: customer-production-${{ github.sha }}
                  path: ${{ runner.temp }}/customer-production
                  if-no-files-found: error
                  retention-days: 7

              - name: Verify Customer dependency files and tree are stable
                run: |
                  set -euo pipefail
                  rm -rf customer-app/node_modules customer-app/dist
                  git diff --exit-code -- customer-app/package.json customer-app/package-lock.json
                  test -z "$(git status --porcelain --untracked-files=all -- customer-app)"

          '''
          text = text[:start] + customer_job + text[end:]
          ci.write_text(text)

          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text()
          text = replace_once(
              text,
              '      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n\n      - name: Install dependencies\n        working-directory: customer-app\n        run: npm install\n',
              '      - name: Setup Customer Node 22\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n          cache-dependency-path: customer-app/package-lock.json\n\n      - name: Install Customer dependencies from lockfile\n        working-directory: customer-app\n        run: npm ci --no-fund\n',
              'Pages customer install',
          )
          text = replace_once(
              text,
              '      - name: Build customer app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n',
              '      - name: Build Customer production app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n\n      - name: Verify Customer production build environment\n        working-directory: customer-app\n        run: node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Pages Production"\n',
              'Pages customer verifier',
          )
          pages.write_text(text)

          native = Path('.github/workflows/mobile-native.yml')
          text = native.read_text().replace('run: npm install --no-fund', 'run: npm ci --no-fund')
          android_build = '      - name: Build web app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n\n      - name: Create Android project\n'
          android_new = '      - name: Build web app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n\n      - name: Verify Android production web environment\n        working-directory: customer-app\n        run: node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Android Production"\n\n      - name: Create Android project\n'
          text = replace_once(text, android_build, android_new, 'Android pre-sync verifier')
          text = replace_once(
              text,
              '      - name: Sync Android project\n        working-directory: customer-app\n        run: npx cap sync android\n',
              '      - name: Sync Android project\n        working-directory: customer-app\n        run: npx cap sync android\n\n      - name: Verify synced Android web artifact\n        working-directory: customer-app\n        run: node scripts/verify-build-env.mjs --dist="android/app/src/main/assets/public" --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Android synced artifact"\n',
              'Android synced verifier',
          )
          ios_build = '      - name: Build web app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n\n      - name: Create iOS project\n'
          ios_new = '      - name: Build web app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n\n      - name: Verify iOS production web environment\n        working-directory: customer-app\n        run: node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="iOS Production"\n\n      - name: Create iOS project\n'
          text = replace_once(text, ios_build, ios_new, 'iOS pre-sync verifier')
          text = replace_once(
              text,
              '      - name: Sync iOS project\n        working-directory: customer-app\n        run: npx cap sync ios\n',
              '      - name: Sync iOS project\n        working-directory: customer-app\n        run: npx cap sync ios\n\n      - name: Verify synced iOS web artifact\n        working-directory: customer-app\n        run: node scripts/verify-build-env.mjs --dist="ios/App/App/public" --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="iOS synced artifact"\n',
              'iOS synced verifier',
          )
          native.write_text(text)

          release = Path('.github/workflows/mobile-release.yml')
          text = release.read_text().replace('run: npm install --no-fund', 'run: npm ci --no-fund')
          text = replace_once(
              text,
              '      - name: Build web app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n',
              '      - name: Build web app\n        working-directory: customer-app\n        env:\n          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com\n        run: npm run build\n\n      - name: Verify Android release production web environment\n        working-directory: customer-app\n        run: node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Android Release Production"\n',
              'Android release pre-sync verifier',
          )
          text = replace_once(
              text,
              '      - name: Sync Android project\n        working-directory: customer-app\n        run: npx cap sync android\n',
              '      - name: Sync Android project\n        working-directory: customer-app\n        run: npx cap sync android\n\n      - name: Verify synced Android release web artifact\n        working-directory: customer-app\n        run: node scripts/verify-build-env.mjs --dist="android/app/src/main/assets/public" --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Android release synced artifact"\n',
              'Android release synced verifier',
          )
          release.write_text(text)
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - name: Clean install and audit
        working-directory: customer-app
        run: |
          rm -rf node_modules dist
          npm ci --no-fund
          npm audit --audit-level=high

      - name: Prove missing Staging env is rejected
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: ""
        run: |
          set -euo pipefail
          npm run build
          if node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api-staging.onrender.com" --forbidden="https://aqaba-seago-api.onrender.com" --base="/-aqaba-seago/" --label="Staging missing env"; then
            echo "Missing staging env was incorrectly accepted"
            exit 1
          fi

      - name: Prove isolated Staging artifact
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api-staging.onrender.com
        run: |
          rm -rf dist
          npm run build
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api-staging.onrender.com" --forbidden="https://aqaba-seago-api.onrender.com" --base="/-aqaba-seago/" --label="Staging"

      - name: Prove repeatable Production builds and hashes
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Production first"
          (cd dist && find assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/customer-first.sha256"
          rm -rf node_modules dist
          npm ci --no-fund
          npm run build
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Production second"
          (cd dist && find assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/customer-second.sha256"
          diff -u "$RUNNER_TEMP/customer-first.sha256" "$RUNNER_TEMP/customer-second.sha256"
          echo "TASK7_ARTIFACT_HASHES"
          cat "$RUNNER_TEMP/customer-second.sha256"

      - name: Check dependency and source drift
        run: |
          set -euo pipefail
          rm -rf customer-app/node_modules customer-app/dist
          git diff --exit-code -- customer-app/package.json customer-app/package-lock.json
          git diff --check

      - name: Remove bootstrap workflows and commit Task 7 changes
        run: |
          set -euo pipefail
          git rm .github/workflows/task7-customer-lock-bootstrap.yml .github/workflows/task7-customer-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/pages.yml .github/workflows/mobile-native.yml .github/workflows/mobile-release.yml customer-app/scripts/verify-build-env.mjs customer-app/package.json customer-app/package-lock.json
          git commit -m "Enforce reproducible Customer builds and environment isolation"
          git push origin HEAD:phase1/task7-customer-reproducible-build
