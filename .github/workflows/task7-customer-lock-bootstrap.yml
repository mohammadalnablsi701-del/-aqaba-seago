name: Task 7 Customer Lock Bootstrap

on:
  push:
    branches: ["phase1/task7-customer-reproducible-build"]
    paths:
      - "customer-app/package.json"
      - ".github/workflows/task7-customer-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase1/task7-customer-reproducible-build

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile from current dependency contract
        working-directory: customer-app
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Prove clean install and current resolved versions
        working-directory: customer-app
        run: |
          npm ci --no-fund
          npm ls --depth=0

      - name: Prove Customer build before pinning
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-app/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git commit -m "Generate Customer npm lockfile"
          git push origin HEAD:phase1/task7-customer-reproducible-build
