name: Mobile Native Build

on:
  push:
    branches: [main]
    paths:
      - "customer-app/**"
      - ".github/workflows/mobile-native.yml"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Also build an unsigned iOS simulator app"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: customer-app
        run: npm install --no-fund

      - name: Build web app
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Create Android project
        working-directory: customer-app
        run: npx cap add android

      - name: Install native image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Generate branded Android assets
        working-directory: customer-app
        run: bash scripts/generate-native-assets.sh android

      - name: Sync Android project
        working-directory: customer-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: customer-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify release bundle builds
        working-directory: customer-app/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aqaba-seago-android-debug
          path: customer-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aqaba-seago-android-release-unsigned
          path: customer-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: customer-app
        run: npm install --no-fund

      - name: Build web app
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Create iOS project
        working-directory: customer-app
        run: npx cap add ios

      - name: Install native image tools
        run: |
          brew list imagemagick >/dev/null 2>&1 || brew install imagemagick
          brew list librsvg >/dev/null 2>&1 || brew install librsvg

      - name: Generate branded iOS assets
        working-directory: customer-app
        run: bash scripts/generate-native-assets.sh ios

      - name: Sync iOS project
        working-directory: customer-app
        run: npx cap sync ios

      - name: Build unsigned simulator app
        working-directory: customer-app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: aqaba-seago-ios-simulator
          path: customer-app/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
