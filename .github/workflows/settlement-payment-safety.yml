name: Settlement Payment Safety

on:
  push:
    branches:
      - feature/final-hardening-task3-settlement-payment-safety
      - staging
      - main
  pull_request:
    branches: [staging, main]

jobs:
  settlement-payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install backend dependencies from lockfile
        run: npm ci --no-fund
      - name: Install isolated MongoDB test runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund
      - name: Run Task 3 and financial regressions on disposable replica set
        run: |
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              const child=spawn(process.execPath,[
                '--test',
                'test/settlement-payment-safety.integration.test.js',
                'test/settlement-payment-safety-ui.test.js',
                'test/settlement-ledger.integration.test.js',
                'test/admin-sensitive-actions.integration.test.js',
                'test/admin-payment-operations.integration.test.js',
                'test/admin-booking-support.integration.test.js',
                'test/payment-correlation.integration.test.js',
                'test/payment-transitions.integration.test.js',
                'test/refund-contract.integration.test.js',
                'test/refund-retry-semantics.integration.test.js',
                'test/refund-admin-visibility.integration.test.js'
              ],{
                env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},stdio:'inherit'
              });
              code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
            }finally{await db.stop()}
            process.exit(code??1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Verify no legacy settlement mutation route remains
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'router.post("/settlements/pay"' src/routes/admin.js
          ! grep -q 'window.confirm(`Mark ' admin-app/src/App.jsx

  app-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build customer app
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api-staging.onrender.com
        run: npm ci --no-fund && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Build provider app
        working-directory: provider-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api-staging.onrender.com
        run: npm ci --no-fund && npm run build
      - name: Build admin app
        working-directory: admin-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api-staging.onrender.com
        run: npm ci --no-fund && npm run build
