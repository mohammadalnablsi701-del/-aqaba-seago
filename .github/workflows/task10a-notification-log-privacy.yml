name: Task 10A NotificationLog Privacy

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  notification-log-privacy-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup exact Backend Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies from lockfile
        run: npm ci --no-fund

      - name: Install isolated MongoDB test runner outside the repository
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund

      - name: Prove dry-run, apply, guards, timestamp preservation and idempotency on disposable replica set
        run: |
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              const child=spawn(process.execPath,[
                '--test',
                'test/notification-log-privacy-cleanup.integration.test.js'
              ],{
                env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},
                stdio:'inherit'
              });
              code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
            }finally{
              await db.stop();
            }
            process.exit(code??1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
