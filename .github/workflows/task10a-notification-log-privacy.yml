name: Task 10A NotificationLog Privacy

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  notification-log-privacy-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup exact Backend Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies from lockfile
        run: npm ci --no-fund


      - name: Prove dry-run, apply, guards, timestamp preservation and idempotency on disposable replica set
        run: |
          npm run test:db -- test/notification-log-privacy-cleanup.integration.test.js
