name: Task 4 Provider Patch

on:
  push:
    branches:
      - fix/provider-dashboard-request-safety-clean

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-dashboard-request-safety-clean
      - name: Apply minimal App.jsx patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/task4_patch.py
          python /tmp/task4_patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider-app/src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize provider dashboard request lifecycle"
          git push origin HEAD:fix/provider-dashboard-request-safety-clean
