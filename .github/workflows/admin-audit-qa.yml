name: Admin Audit QA

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  admin-audit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install backend dependencies from lockfile
        run: npm ci
      - name: Run admin audit and booking support tests on a disposable replica set
        run: |
          npm run test:unit -- test/admin-audit-ui.test.js test/admin-booking-support-ui.test.js
          npm run test:db -- test/admin-audit-trail.integration.test.js test/admin-booking-support.integration.test.js
