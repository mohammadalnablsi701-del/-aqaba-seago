name: Customer Platform Pause Safety

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  platform-pause-payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install backend dependencies from lockfile
        run: npm ci
      - name: Run final-confirmation platform pause integration test
        run: |
          npm run test:db -- test/customer-platform-pause-payment.integration.test.js
