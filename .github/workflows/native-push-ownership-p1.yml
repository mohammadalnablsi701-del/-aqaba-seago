name: Native Push Ownership P1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mongo-ownership-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install backend dependencies from lockfile
        run: npm ci --engine-strict
      - name: Install isolated MongoDB test runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund
      - name: Run Mongo-backed native push ownership and lifecycle fence tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              for(const file of [
                'test/native-push-ownership-mongo.integration.test.js',
                'test/native-push-lifecycle-fence-mongo.integration.test.js'
              ]){
                const child=spawn(process.execPath,['--test',file],{
                  env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},
                  stdio:'inherit'
                });
                code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
                if(code!==0)break;
              }
            }finally{
              await db.stop();
            }
            process.exit(code??1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
