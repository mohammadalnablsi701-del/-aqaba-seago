name: One-time password recovery UI patch

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/patch-password-recovery-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch customer sign-in recovery entry
        shell: python
        run: |
          from pathlib import Path

          p=Path('customer-app/src/App.jsx')
          s=p.read_text()

          old_import='''  loginCustomer, registerCustomer, listNotifications, markNotificationRead, markAllNotificationsRead, enablePushNotifications, pushNotificationStatus, sendTestPush, googleAuthConfig, googleSignIn, saveAccountPhone, createSupportRequest\n} from "./api.js";'''
          new_import='''  loginCustomer, registerCustomer, listNotifications, markNotificationRead, markAllNotificationsRead, enablePushNotifications, pushNotificationStatus, sendTestPush, googleAuthConfig, googleSignIn, saveAccountPhone, createSupportRequest\n} from "./api.js";'''
          if old_import not in s:
              raise SystemExit('Expected API import block not found; refusing to patch')
          # Import list does not need recovery helpers because request flow is a dedicated route.

          old='''      <button className="auth-switch" onClick={()=>switchMode(mode==="login"?"register":"login")}>
        {mode==="login" ? "New to SeaGo? Create an account" : "Already have an account? Sign in"}
      </button>'''
          new='''      {mode==="login"&&<button className="auth-switch" type="button" onClick={()=>{const url=new URL(window.location.href);url.searchParams.set("forgotPassword","1");window.location.href=url.pathname+"?"+url.searchParams.toString();}}>Forgot password?</button>}
      <button className="auth-switch" type="button" onClick={()=>switchMode(mode==="login"?"register":"login")}>
        {mode==="login" ? "New to SeaGo? Create an account" : "Already have an account? Sign in"}
      </button>'''
          if old not in s:
              raise SystemExit('Expected AuthForm switch block not found; refusing to patch')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify customer app builds
        working-directory: customer-app
        run: npm install --no-fund && npm run build
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- customer-app/src/App.jsx; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-app/src/App.jsx
          git commit -m 'Add forgot password entry to customer sign-in'
          git push origin HEAD:staging
