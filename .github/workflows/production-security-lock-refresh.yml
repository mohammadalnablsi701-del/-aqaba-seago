name: Production Security Lock Refresh

on:
  push:
    branches:
      - security/production-node-22.23.4-2026-10-27

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/production-node-22.23.4-2026-10-27

      - name: Setup Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh non-breaking security fixes in lockfile
        shell: bash
        run: |
          set -uo pipefail
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Verify expected security fixes and high-severity gate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const root = lock.packages?.[''];
          if (root?.engines?.node !== '22.23.4') throw new Error(`lockfile Node contract is ${root?.engines?.node}`);
          const body = lock.packages?.['node_modules/body-parser']?.version;
          const ip = lock.packages?.['node_modules/ip-address']?.version;
          if (body !== '1.20.9') throw new Error(`Expected body-parser 1.20.9, got ${body}`);
          if (ip !== '10.7.5') throw new Error(`Expected ip-address 10.7.5, got ${ip}`);
          console.log({ node: root.engines.node, bodyParser: body, ipAddress: ip });
          NODE
          npm audit --audit-level=high

      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json || { echo 'package.json changed unexpectedly'; exit 1; }
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: refresh production backend lockfile'
          git push
