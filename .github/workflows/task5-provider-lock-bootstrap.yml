name: Task 5 Provider Lock Bootstrap

on:
  push:
    branches: [phase1/task5-reproducible-provider-build]
    paths:
      - "provider-app/package.json"
      - ".github/workflows/task5-provider-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-provider-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: phase1/task5-reproducible-provider-build

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve current provider graph once
        working-directory: provider-app
        run: npm install --no-fund

      - name: Freeze resolved direct dependency versions
        working-directory: provider-app
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkgPath = path.resolve('package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          for (const name of Object.keys(pkg.dependencies || {})) {
            const depPkg = JSON.parse(fs.readFileSync(path.resolve('node_modules', name, 'package.json'), 'utf8'));
            pkg.dependencies[name] = depPkg.version;
          }
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit frozen provider graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider-app/package.json provider-app/package-lock.json
          git commit -m "chore(provider): freeze dependency graph"
          git push origin HEAD:phase1/task5-reproducible-provider-build

      - name: Verify clean install, build and audit
        working-directory: provider-app
        run: |
          rm -rf node_modules dist
          npm ci --no-fund
          npm run build
          npm audit --audit-level=high
