name: One-shot Android FCM Code Prep Apply v3

on:
  push:
    branches: [feature/android-fcm-code-prep]
    paths:
      - ".github/workflows/fcm-code-prep-apply-v3.yml"

permissions:
  contents: write

jobs:
  apply-validate-commit-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v4
        with:
          ref: feature/android-fcm-code-prep

      - name: Apply previously validated code preparation
        run: |
          python3 scripts/fix-fcm-apply.py
          python3 scripts/apply-fcm-code-prep.py

      - name: Pin Firebase Admin to Node 20 compatible v13 line and regenerate lockfile
        run: npm install firebase-admin@13.10.0 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Setup exact backend Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Backend npm ci with engine enforcement
        run: npm ci --no-fund --engine-strict

      - name: Backend tests
        run: npm test

      - name: Setup customer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - name: Customer npm ci
        working-directory: customer-app
        run: npm ci --no-fund

      - name: Customer native push/config tests
        working-directory: customer-app
        run: npm run test:native-push

      - name: Customer production build with native push disabled
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
          VITE_NATIVE_PUSH_ENABLED: "false"
        run: npm run build

      - name: Generate Android project and validate Gradle preparation without Firebase config
        working-directory: customer-app
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          npm run mobile:fcm:prepare
          grep -q "com.google.gms:google-services" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle
          test ! -f android/app/google-services.json

      - name: Diff safety check
        run: git diff --check

      - name: Remove generated Android/build output only
        run: rm -rf customer-app/android customer-app/dist

      - name: Commit validated non-workflow implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example .gitignore package.json package-lock.json \
            customer-app/.env.example customer-app/MOBILE.md customer-app/package.json \
            customer-app/src/api.js customer-app/src/nativePush.js customer-app/src/nativePushConfig.js \
            customer-app/scripts/prepare-android-fcm.mjs customer-app/scripts/test-native-push-config.mjs \
            src/models/NativePushToken.js src/routes/push.js src/services/nativePush.js \
            src/services/notificationChannels.js src/services/notifications.js \
            test/android-fcm-code-prep.test.js test/notification-push-hardening.test.js
          git diff --cached --check
          git commit -m "feat: prepare Android FCM delivery safely"
          git push origin HEAD:feature/android-fcm-code-prep
