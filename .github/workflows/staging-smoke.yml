name: Staging Smoke

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_API: https://aqaba-seago-api-staging-staging.up.railway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for expected staging API commit
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git log -1 --format=%H -- src package.json package-lock.json)"
          for i in {1..36}; do
            ready_code="$(curl -sS -o /tmp/ready.json -w "%{http_code}" "$STAGING_API/ready" || true)"
            deployed="$(curl -fsS "$STAGING_API/health" | node -pe 'JSON.parse(fs.readFileSync(0,"utf8")).commit||""' || true)"
            echo "API required: $expected"
            echo "API deployed: $deployed"
            if [ "$ready_code" = "200" ] && grep -q '"ok":true' /tmp/ready.json && [ -n "$deployed" ] && git cat-file -e "$deployed^{commit}" 2>/dev/null && git merge-base --is-ancestor "$expected" "$deployed"; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 10
          done
          echo "Staging did not converge to expected API commit $expected"
          cat /tmp/ready.json || true
          exit 1

      - name: Verify staging public API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$STAGING_API/health" | grep -q '"ok":true'
          curl -fsS "$STAGING_API/api/trips" > /tmp/trips.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/trips.json","utf8")); if(!Array.isArray(x)) process.exit(1); console.log("Staging public trips:",x.length)'

      - name: Verify staging safety mode
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS "$STAGING_API/ready")"
          echo "$body"
          echo "$body" | grep -q '"publicLaunch":false'
