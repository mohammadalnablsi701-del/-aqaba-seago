name: Staging Smoke

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_API: https://aqaba-seago-api-staging-staging.up.railway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for expected staging API content
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git log -1 --format=%H -- src package.json package-lock.json)"
          for i in {1..36}; do
            ready_code="$(curl -sS -o /tmp/ready.json -w "%{http_code}" "$STAGING_API/ready" || true)"
            deployed="$(curl -fsS "$STAGING_API/health" | node -pe 'JSON.parse(fs.readFileSync(0,"utf8")).commit||""' || true)"
            echo "Backend required from: $expected"
            echo "API deployed commit:  $deployed"

            if [ "$ready_code" = "200" ] && grep -q '"ok":true' /tmp/ready.json && [ -n "$deployed" ]; then
              if ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$deployed" || true
              fi
              if git cat-file -e "$deployed^{commit}" 2>/dev/null && git diff --quiet "$expected" "$deployed" -- src package.json package-lock.json; then
                cat /tmp/ready.json
                break
              fi
            fi
            if [ "$i" = "36" ]; then
              echo "Staging backend content did not converge to the expected tree from $expected"
              cat /tmp/ready.json || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify staging public API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$STAGING_API/health" | grep -q '"ok":true'
          curl -fsS "$STAGING_API/api/trips" > /tmp/trips.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/trips.json","utf8")); if(!Array.isArray(x)) process.exit(1); console.log("Staging public trips:",x.length)'

      - name: Verify staging safety mode
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS "$STAGING_API/ready")"
          echo "$body"
          echo "$body" | grep -q '"publicLaunch":false'

      - name: Apply forgot-password entry once
        shell: python
        run: |
          from pathlib import Path
          p=Path('customer-app/src/App.jsx')
          s=p.read_text()
          old='''      <button className="auth-switch" onClick={()=>switchMode(mode==="login"?"register":"login")}>
        {mode==="login" ? "New to SeaGo? Create an account" : "Already have an account? Sign in"}
      </button>'''
          new='''      {mode==="login"&&<button className="auth-switch" type="button" onClick={()=>{const url=new URL(window.location.href);url.searchParams.set("forgotPassword","1");window.location.href=url.pathname+"?"+url.searchParams.toString();}}>Forgot password?</button>}
      <button className="auth-switch" type="button" onClick={()=>switchMode(mode==="login"?"register":"login")}>
        {mode==="login" ? "New to SeaGo? Create an account" : "Already have an account? Sign in"}
      </button>'''
          if new in s:
              print('Forgot-password entry already present')
          elif old in s:
              p.write_text(s.replace(old,new,1))
          else:
              raise SystemExit('Expected AuthForm switch block not found; refusing to patch')

      - name: Verify customer app builds after patch
        working-directory: customer-app
        run: npm install --no-fund && npm run build

      - name: Commit forgot-password entry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- customer-app/src/App.jsx; then
            echo "No UI patch to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-app/src/App.jsx
          git commit -m 'Add forgot password entry to customer sign-in'
          git push origin HEAD:staging
