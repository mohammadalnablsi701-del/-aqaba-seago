name: Patch vessel name UI

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/patch-vessel-name-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Add vessel name to provider and customer UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          provider = Path("provider-app/src/App.jsx")
          s = provider.read_text()
          s = replace_once(
              s,
              'titleAr:trip?.titleAr||(duplicateFrom?String(duplicateFrom.titleAr||duplicateFrom.titleEn||""):""),category:source?.category',
              'titleAr:trip?.titleAr||(duplicateFrom?String(duplicateFrom.titleAr||duplicateFrom.titleEn||""):""),vesselName:source?.vesselName||"",category:source?.category',
              "provider form state"
          )
          s = replace_once(
              s,
              'const data={titleEn:form.titleEn,titleAr:form.titleAr||form.titleEn,category:form.category',
              'const data={titleEn:form.titleEn,titleAr:form.titleAr||form.titleEn,vesselName:form.vesselName,category:form.category',
              "provider save payload"
          )
          s = replace_once(
              s,
              '<label>Trip name<input value={form.titleEn} onChange={e=>setForm({...form,titleEn:e.target.value})} placeholder="Example: Red Sea Snorkeling" required/></label>',
              '<label>Trip name<input value={form.titleEn} onChange={e=>setForm({...form,titleEn:e.target.value})} placeholder="Example: Red Sea Snorkeling" required/></label><label>Yacht / vessel name<input value={form.vesselName} onChange={e=>setForm({...form,vesselName:e.target.value})} placeholder="Example: White Prince"/></label>',
              "provider vessel input"
          )
          s = replace_once(
              s,
              '<span>{t.category.replaceAll("_"," ")} · {t.durationMinutes} min</span>',
              '<span>{t.vesselName?`${t.vesselName} · `:""}{t.category.replaceAll("_"," ")} · {t.durationMinutes} min</span>',
              "provider trip card"
          )
          provider.write_text(s)

          customer = Path("customer-app/src/App.jsx")
          c = customer.read_text()
          c = replace_once(
              c,
              '    providerName: raw.providerId?.businessName || "Aqaba SeaGo partner",\n    verifiedProvider: true,',
              '    providerName: raw.providerId?.businessName || "Aqaba SeaGo partner",\n    vesselName: raw.vesselName || "",\n    verifiedProvider: true,',
              "customer trip mapper"
          )
          c = replace_once(
              c,
              '        <p>{trip.providerName || trip.subtitle}</p>\n        <div className="trip-card__facts">',
              '        <p>{trip.providerName || trip.subtitle}</p>\n        {trip.vesselName&&<p>Yacht: {trip.vesselName}</p>}\n        <div className="trip-card__facts">',
              "customer trip card"
          )
          c = replace_once(
              c,
              '        <div className="detail-rating detail-rating--verified"><CheckCircle2 size={16}/> Verified operator <span>{trip.providerName || "Approved SeaGo partner"}</span></div>\n\n        <div className="detail-price-summary">',
              '        <div className="detail-rating detail-rating--verified"><CheckCircle2 size={16}/> Verified operator <span>{trip.providerName || "Approved SeaGo partner"}</span></div>\n        {trip.vesselName&&<div className="detail-kicker">Yacht / vessel · {trip.vesselName}</div>}\n\n        <div className="detail-price-summary">',
              "customer trip detail"
          )
          customer.write_text(c)
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'Yacht / vessel name' provider-app/src/App.jsx
          grep -q 'vesselName: raw.vesselName' customer-app/src/App.jsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider-app/src/App.jsx customer-app/src/App.jsx
          git commit -m "Expose vessel name in provider and customer apps"
          git push origin HEAD:staging
