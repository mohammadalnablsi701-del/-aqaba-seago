name: Task 7 Authority Patch

on:
  push:
    branches: [phase1-task7-admin-provider-sales-authority]
    paths:
      - scripts/apply-task7-authority.mjs
      - .github/workflows/task7-authority-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-task7-admin-provider-sales-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded Task 7 patch
        run: node scripts/apply-task7-authority.mjs
      - name: Verify intended changes exist
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code --quiet && { echo "Patch produced no changes"; exit 1; } || true
          grep -q 'platformStatus' src/models/Trip.js
          grep -q 'sellableTripFilter' src/services/checkout.js
          grep -q 'Pause on platform' admin-app/src/App.jsx
          grep -q 'Paused by Aqaba SeaGo' provider-app/src/App.jsx
      - name: Commit implementation to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src admin-app provider-app test .github/workflows/ci.yml
          git commit -m "Implement independent admin and provider trip sales authority"
          git push origin HEAD:phase1-task7-admin-provider-sales-authority
