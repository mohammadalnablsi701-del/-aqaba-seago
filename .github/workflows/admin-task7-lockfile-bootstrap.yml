name: Admin Task 7 Lockfile Bootstrap

on:
  push:
    branches: [phase1/admin-task7-reproducible-build]

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase1/admin-task7-reproducible-build
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Admin package-lock from pinned dependencies
        working-directory: admin-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git add admin-app/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Admin package lockfile"
          git push origin HEAD:phase1/admin-task7-reproducible-build
