name: Deploy Customer App Preview

on:
  push:
    branches: [main]
    paths:
      - "customer-app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Convert embedded hero to real JPG
        working-directory: customer-app
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "src/styles.css";
          let css = fs.readFileSync(path, "utf8");
          const re = /background-image:url\("data:image\/jpeg;base64,([^"]+)"\)/;
          const match = css.match(re);
          if (!match) throw new Error("Embedded Aqaba hero image not found");
          const buffer = Buffer.from(match[1], "base64");
          if (buffer.length < 30000) throw new Error("Decoded hero image is unexpectedly small");
          fs.mkdirSync("public", { recursive: true });
          fs.writeFileSync("public/aqaba-seago-hero-v3.jpg", buffer);
          css = css.replace(
            re,
            'background-image:url("/-aqaba-seago/aqaba-seago-hero-v3.jpg")'
          );
          fs.writeFileSync(path, css);
          console.log("Hero JPG bytes:", buffer.length);
          NODE

      - name: Install dependencies
        working-directory: customer-app
        run: npm install

      - name: Build preview
        working-directory: customer-app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: customer-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
