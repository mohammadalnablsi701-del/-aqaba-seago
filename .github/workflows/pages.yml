name: Deploy Customer App Preview

on:
  push:
    branches: [main]
    paths:
      - "customer-app/**"
      - "provider-app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: customer-app
        run: npm install

      - name: Build preview
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Install provider dependencies
        working-directory: provider-app
        run: npm install

      - name: Build provider app
        working-directory: provider-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Merge provider app into customer site
        run: |
          mkdir -p customer-app/dist/provider
          cp -R provider-app/dist/* customer-app/dist/provider/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: customer-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
