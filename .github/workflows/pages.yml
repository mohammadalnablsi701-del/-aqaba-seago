name: Deploy Aqaba SeaGo Apps Preview

on:
  push:
    branches: [main]
    paths:
      - "customer-app/**"
      - "provider-app/**"
      - "admin-app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: customer-app
        run: npm install

      - name: Build customer app
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Setup Node 20 for provider
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install provider dependencies from lockfile
        working-directory: provider-app
        run: npm ci

      - name: Build provider app
        working-directory: provider-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Verify production Provider build environment
        working-directory: provider-app
        run: node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/provider/"

      - name: Merge provider app into customer site
        run: |
          mkdir -p customer-app/dist/provider
          cp -R provider-app/dist/* customer-app/dist/provider/

      - name: Restore Node 22 for admin
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: admin-app
        run: npm install

      - name: Build admin app
        working-directory: admin-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: npm run build

      - name: Merge admin app into customer site
        run: |
          mkdir -p customer-app/dist/admin
          cp -R admin-app/dist/* customer-app/dist/admin/

      - name: Write deployment version
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > customer-app/dist/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: customer-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
