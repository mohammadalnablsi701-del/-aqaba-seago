name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20 for backend audit
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend dependencies
        run: npm install --no-fund && npm audit --audit-level=high
      - name: Setup Node 22 for customer audit
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit customer app dependencies from lockfile
        working-directory: customer-app
        run: npm ci --no-fund && npm audit --audit-level=high
      - name: Setup Node 20 for provider and admin audits
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit provider app dependencies
        working-directory: provider-app
        run: npm ci --no-fund && npm audit --audit-level=high
      - name: Audit admin app dependencies
        working-directory: admin-app
        run: npm ci --no-fund && npm audit --audit-level=high

  payment-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Install isolated MongoDB test runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund
      - name: Test payment, cancellation, ticket lifecycle, booking, permissions, operations, provider access, sellability semantics, sensitive admin actions, pilot E2E, recovery and backup/restore on a disposable replica set
        run: |
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              const child=spawn(process.execPath,[
                '--test',
                'test/payment-transitions.integration.test.js',
                'test/checkout-capacity.integration.test.js',
                'test/ticket-checkin.integration.test.js',
                'test/customer-ticket-lifecycle.integration.test.js',
                'test/customer-cancellation.integration.test.js',
                'test/settlement-ledger.integration.test.js',
                'test/provider-role-permissions.integration.test.js',
                'test/provider-sales-control.integration.test.js',
                'test/admin-sellability-semantics.integration.test.js',
                'test/admin-sensitive-actions.integration.test.js',
                'test/admin-operations.integration.test.js',
                'test/admin-payment-operations.integration.test.js',
                'test/provider-access-admin.integration.test.js',
                'test/pilot-booking-ticket.e2e.test.js',
                'test/password-recovery.integration.test.js',
                'test/database-backup-restore.integration.test.js'
              ],{
                env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},stdio:'inherit'
              });
              code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
            }finally{await db.stop()}
            process.exit(code??1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Run backend tests
        run: npm test

  customer-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - name: Install Customer dependencies from lockfile
        working-directory: customer-app
        run: npm ci --no-fund

      - name: Verify Customer source has no hardcoded deployed API
        working-directory: customer-app
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --include='*.html' --include='*.json' --include='*.webmanifest' 'onrender[.]com' src public index.html capacitor.config.ts || true)"
          if [[ -n "$matches" ]]; then
            echo "Hardcoded deployed API URL found in Customer source"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Prove missing Staging API is rejected
        working-directory: customer-app
        shell: bash
        env:
          VITE_API_BASE_URL: ""
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          if node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api-staging.onrender.com" --forbidden="https://aqaba-seago-api.onrender.com" --base="/-aqaba-seago/" --label="Staging missing env"; then
            echo "Missing Staging environment was incorrectly accepted"
            exit 1
          fi
          echo "Missing Staging environment rejected as expected"

      - name: Build and verify Staging Customer artifact
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api-staging.onrender.com
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api-staging.onrender.com" --forbidden="https://aqaba-seago-api.onrender.com" --base="/-aqaba-seago/" --label="Staging"
          rm -rf "$RUNNER_TEMP/customer-staging"
          cp -R dist "$RUNNER_TEMP/customer-staging"

      - name: Build and verify Production Customer artifact
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Production first build"
          (cd dist && find assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/customer-prod-1.sha256"
          rm -rf "$RUNNER_TEMP/customer-production"
          cp -R dist "$RUNNER_TEMP/customer-production"

      - name: Rebuild Production Customer from a second clean install
        working-directory: customer-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: |
          set -euo pipefail
          rm -rf node_modules dist
          npm ci --no-fund
          npm run build
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/" --label="Production second clean build"
          (cd dist && find assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/customer-prod-2.sha256"
          diff -u "$RUNNER_TEMP/customer-prod-1.sha256" "$RUNNER_TEMP/customer-prod-2.sha256"
          echo "Customer production JS/CSS hashes are deterministic:"
          cat "$RUNNER_TEMP/customer-prod-2.sha256"

      - name: Upload Customer Staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-staging-${{ github.sha }}
          path: ${{ runner.temp }}/customer-staging
          if-no-files-found: error
          retention-days: 7

      - name: Upload Customer Production artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-production-${{ github.sha }}
          path: ${{ runner.temp }}/customer-production
          if-no-files-found: error
          retention-days: 7

      - name: Verify Customer dependency files and tree are stable
        run: |
          set -euo pipefail
          rm -rf customer-app/node_modules customer-app/dist
          git diff --exit-code -- customer-app/package.json customer-app/package-lock.json
          test -z "$(git status --porcelain --untracked-files=all -- customer-app)"

  provider-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Provider build environment
        shell: bash
        run: |
          set -euo pipefail
          target="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          case "$target" in
            staging)
              echo "PROVIDER_API=https://aqaba-seago-api-staging.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_FORBIDDEN_API=https://aqaba-seago-api.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_BASE_PATH=/" >> "$GITHUB_ENV"
              ;;
            main)
              echo "PROVIDER_API=https://aqaba-seago-api.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_FORBIDDEN_API=https://aqaba-seago-api-staging.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_BASE_PATH=/-aqaba-seago/provider/" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported Provider build target: $target"
              exit 1
              ;;
          esac

      - name: Install provider app dependencies from lockfile
        working-directory: provider-app
        run: npm ci

      - name: Build provider app
        working-directory: provider-app
        run: VITE_API_BASE_URL="$PROVIDER_API" npm run build -- --base="$PROVIDER_BASE_PATH"

      - name: Verify Provider build artifact and environment
        working-directory: provider-app
        run: node scripts/verify-build-env.mjs --expected="$PROVIDER_API" --forbidden="$PROVIDER_FORBIDDEN_API" --base="$PROVIDER_BASE_PATH"

      - name: Smoke serve Provider build
        working-directory: provider-app
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/provider-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:4173/" -o /tmp/provider-index.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/provider-preview.log || true
            exit 1
          fi
          grep -qi '<!doctype html' /tmp/provider-index.html

      - name: Rebuild provider app from a clean install
        working-directory: provider-app
        run: |
          rm -rf node_modules dist
          npm ci
          VITE_API_BASE_URL="$PROVIDER_API" npm run build -- --base="$PROVIDER_BASE_PATH"
          node scripts/verify-build-env.mjs --expected="$PROVIDER_API" --forbidden="$PROVIDER_FORBIDDEN_API" --base="$PROVIDER_BASE_PATH"

      - name: Upload Provider build artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-build-${{ github.sha }}
          path: provider-app/dist
          if-no-files-found: error
          retention-days: 7

      - name: Verify provider dependency files are stable
        run: |
          set -euo pipefail
          rm -rf provider-app/node_modules provider-app/dist
          git diff --exit-code -- provider-app/package.json provider-app/package-lock.json
          test -z "$(git status --porcelain --untracked-files=all -- provider-app)"

  admin-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Admin dependencies from lockfile
        working-directory: admin-app
        run: npm ci

      - name: Build and verify Staging Admin artifact
        working-directory: admin-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api-staging.onrender.com
        run: |
          rm -rf dist
          npm run build -- --base=/
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api-staging.onrender.com" --forbidden="https://aqaba-seago-api.onrender.com" --base="/"

      - name: Build and verify Production Admin artifact
        working-directory: admin-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: |
          rm -rf dist
          npm run build -- --base="/-aqaba-seago/admin/"
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/admin/"

      - name: Rebuild Production Admin from a second clean install
        working-directory: admin-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: |
          rm -rf node_modules dist
          npm ci
          npm run build -- --base="/-aqaba-seago/admin/"
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="/-aqaba-seago/admin/"

      - name: Verify Admin dependency files are stable
        run: |
          set -euo pipefail
          rm -rf admin-app/node_modules admin-app/dist
          git diff --exit-code -- admin-app/package.json admin-app/package-lock.json
          test -z "$(git status --porcelain --untracked-files=all -- admin-app)"

  release-guard:
    name: release-guard
    if: always()
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-audit
      - payment-integration
      - backend-test
      - customer-app-build
      - provider-app-build
      - admin-app-build
    steps:
      - name: Require all CI gates
        env:
          REQUIRED_RESULTS: >-
            ${{ needs.secret-scan.result }}
            ${{ needs.dependency-audit.result }}
            ${{ needs.payment-integration.result }}
            ${{ needs.backend-test.result }}
            ${{ needs.customer-app-build.result }}
            ${{ needs.provider-app-build.result }}
            ${{ needs.admin-app-build.result }}
        run: |
          set -euo pipefail
          for result in $REQUIRED_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Required CI gate did not pass: $result"
              exit 1
            fi
          done
