name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20 for backend audit
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend dependencies
        run: npm install --no-fund && npm audit --audit-level=high
      - name: Setup Node 22 for customer audit
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit customer app dependencies
        working-directory: customer-app
        run: npm install --no-fund && npm audit --audit-level=high
      - name: Setup Node 20 for provider and admin audits
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit provider app dependencies
        working-directory: provider-app
        run: npm ci --no-fund && npm audit --audit-level=high
      - name: Audit admin app dependencies
        working-directory: admin-app
        run: npm install --no-fund && npm audit --audit-level=high

  payment-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Install isolated MongoDB test runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund
      - name: Test payment, booking, permissions, operations, provider access, pilot E2E, recovery and backup/restore on a disposable replica set
        run: |
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              const child=spawn(process.execPath,[
                '--test',
                'test/payment-transitions.integration.test.js',
                'test/checkout-capacity.integration.test.js',
                'test/ticket-checkin.integration.test.js',
                'test/settlement-ledger.integration.test.js',
                'test/provider-role-permissions.integration.test.js',
                'test/admin-operations.integration.test.js',
                'test/provider-access-admin.integration.test.js',
                'test/pilot-booking-ticket.e2e.test.js',
                'test/password-recovery.integration.test.js',
                'test/database-backup-restore.integration.test.js'
              ],{
                env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},stdio:'inherit'
              });
              code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
            }finally{await db.stop()}
            process.exit(code??1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Run backend tests
        run: npm test

  customer-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install customer app dependencies
        working-directory: customer-app
        run: npm install
      - name: Build customer app
        working-directory: customer-app
        run: npm run build

  provider-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Provider build environment
        shell: bash
        run: |
          set -euo pipefail
          target="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          case "$target" in
            staging)
              echo "PROVIDER_API=https://aqaba-seago-api-staging.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_FORBIDDEN_API=https://aqaba-seago-api.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_BASE_PATH=/" >> "$GITHUB_ENV"
              ;;
            main)
              echo "PROVIDER_API=https://aqaba-seago-api.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_FORBIDDEN_API=https://aqaba-seago-api-staging.onrender.com" >> "$GITHUB_ENV"
              echo "PROVIDER_BASE_PATH=/-aqaba-seago/provider/" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported Provider build target: $target"
              exit 1
              ;;
          esac

      - name: Install provider app dependencies from lockfile
        working-directory: provider-app
        run: npm ci

      - name: Build provider app
        working-directory: provider-app
        run: VITE_API_BASE_URL="$PROVIDER_API" npm run build -- --base="$PROVIDER_BASE_PATH"

      - name: Verify Provider build artifact and environment
        working-directory: provider-app
        run: node scripts/verify-build-env.mjs --expected="$PROVIDER_API" --forbidden="$PROVIDER_FORBIDDEN_API" --base="$PROVIDER_BASE_PATH"

      - name: Smoke serve Provider build
        working-directory: provider-app
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/provider-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          url="http://127.0.0.1:4173${PROVIDER_BASE_PATH}"
          for i in {1..20}; do
            if curl -fsS "$url" -o /tmp/provider-index.html; then
              break
            fi
            sleep 1
          done
          grep -qi '<!doctype html' /tmp/provider-index.html
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$chrome" ]; then
            "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$url" \
              > /tmp/provider-dom.html 2>/tmp/provider-chrome.log
            grep -q 'Provider sign in' /tmp/provider-dom.html
          else
            echo "::warning::Chrome is unavailable on this runner; curl-level Provider smoke passed."
          fi

      - name: Rebuild provider app from a clean install
        working-directory: provider-app
        run: |
          rm -rf node_modules dist
          npm ci
          VITE_API_BASE_URL="$PROVIDER_API" npm run build -- --base="$PROVIDER_BASE_PATH"
          node scripts/verify-build-env.mjs --expected="$PROVIDER_API" --forbidden="$PROVIDER_FORBIDDEN_API" --base="$PROVIDER_BASE_PATH"

      - name: Upload Provider build artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-build-${{ github.sha }}
          path: provider-app/dist
          if-no-files-found: error
          retention-days: 7

      - name: Verify provider dependency files are stable
        run: |
          set -euo pipefail
          rm -rf provider-app/node_modules provider-app/dist
          git diff --exit-code -- provider-app/package.json provider-app/package-lock.json
          test -z "$(git status --porcelain --untracked-files=all -- provider-app)"

  admin-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install admin app dependencies
        working-directory: admin-app
        run: npm install
      - name: Build admin app
        working-directory: admin-app
        run: npm run build

  release-guard:
    name: release-guard
    if: always()
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-audit
      - payment-integration
      - backend-test
      - customer-app-build
      - provider-app-build
      - admin-app-build
    steps:
      - name: Require all CI gates
        env:
          REQUIRED_RESULTS: >-
            ${{ needs.secret-scan.result }}
            ${{ needs.dependency-audit.result }}
            ${{ needs.payment-integration.result }}
            ${{ needs.backend-test.result }}
            ${{ needs.customer-app-build.result }}
            ${{ needs.provider-app-build.result }}
            ${{ needs.admin-app-build.result }}
        run: |
          set -euo pipefail
          for result in $REQUIRED_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Required CI gate did not pass: $result"
              exit 1
            fi
          done
