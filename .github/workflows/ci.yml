name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20 for backend audit
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend dependencies
        run: npm install --no-fund && npm audit --audit-level=high
      - name: Setup Node 22 for customer audit
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit customer app dependencies
        working-directory: customer-app
        run: npm install --no-fund && npm audit --audit-level=high
      - name: Setup Node 20 for provider and admin audits
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit provider app dependencies
        working-directory: provider-app
        run: npm install --no-fund && npm audit --audit-level=high
      - name: Audit admin app dependencies
        working-directory: admin-app
        run: npm install --no-fund && npm audit --audit-level=high

  payment-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Install isolated MongoDB test runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund
      - name: Test payment, booking, permissions, operations, provider access, pilot financial repair/E2E, recovery and backup/restore on a disposable replica set
        run: |
          node <<'JS'
          const {MongoMemoryReplSet}=require(process.env.RUNNER_TEMP+'/seago-mongo/node_modules/mongodb-memory-server');
          const {spawn}=require('node:child_process');
          (async()=>{
            const db=await MongoMemoryReplSet.create({replSet:{count:1,storageEngine:'wiredTiger'}});
            let code=1;
            try{
              const child=spawn(process.execPath,[
                '--test',
                'test/payment-transitions.integration.test.js',
                'test/checkout-capacity.integration.test.js',
                'test/ticket-checkin.integration.test.js',
                'test/settlement-ledger.integration.test.js',
                'test/provider-role-permissions.integration.test.js',
                'test/admin-operations.integration.test.js',
                'test/provider-access-admin.integration.test.js',
                'test/pilot-financial-stage2b.integration.test.js',
                'test/pilot-booking-ticket.e2e.test.js',
                'test/password-recovery.integration.test.js',
                'test/database-backup-restore.integration.test.js'
              ],{
                env:{...process.env,SEAGO_TEST_MONGODB_URI:db.getUri()},stdio:'inherit'
              });
              code=await new Promise((resolve,reject)=>{child.on('exit',resolve);child.on('error',reject)});
            }finally{await db.stop()}
            process.exit(code??1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Run backend tests
        run: npm test

  customer-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install customer app dependencies
        working-directory: customer-app
        run: npm install
      - name: Build customer app
        working-directory: customer-app
        run: npm run build

  provider-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install provider app dependencies
        working-directory: provider-app
        run: npm install
      - name: Build provider app
        working-directory: provider-app
        run: npm run build

  admin-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install admin app dependencies
        working-directory: admin-app
        run: npm install
      - name: Build admin app
        working-directory: admin-app
        run: npm run build
