name: Customer Payment DTO Safety

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  customer-payment-dto-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install backend dependencies from lockfile
        run: npm ci
      - name: Run customer-safe payment DTO integration test
        run: |
          npm run test:db -- test/customer-payment-dto.integration.test.js
