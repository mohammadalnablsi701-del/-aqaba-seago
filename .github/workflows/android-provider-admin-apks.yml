name: Build SeaGo Provider and Admin Android Online QA APKs

on:
  push:
    branches:
      - build/android-provider-admin-apk-20261107
    paths:
      - ".github/workflows/android-provider-admin-apks.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-provider-admin-apks.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Android APK - ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: provider
            app_name: SeaGo Provider
            app_id: com.aqabaseago.provider
            icon: provider-icon-a-v1-512.png
          - app: admin
            app_name: SeaGo Admin
            app_id: com.aqabaseago.admin
            icon: admin-icon-a-v1-512.png
    steps:
      - name: Check out approved main source and packaging workflow
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned web dependencies
        working-directory: ${{ matrix.app }}-app
        run: npm ci --no-fund

      - name: Compile production app for native file paths
        working-directory: ${{ matrix.app }}-app
        env:
          VITE_API_BASE_URL: https://aqaba-seago-api.onrender.com
        run: |
          npm run build -- --base=./
          node scripts/verify-build-env.mjs --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="./"

      - name: Install pinned Capacitor dependencies without committing changes
        working-directory: ${{ matrix.app }}-app
        run: npm install --no-save --package-lock=false --no-fund @capacitor/cli@8.4.3 @capacitor/core@8.5.2 @capacitor/android@8.5.2

      - name: Generate distinct Android application IDs
        working-directory: ${{ matrix.app }}-app
        env:
          SEAGO_APP_NAME: ${{ matrix.app_name }}
          SEAGO_APP_ID: ${{ matrix.app_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = {
            "appId": os.environ["SEAGO_APP_ID"],
            "appName": os.environ["SEAGO_APP_NAME"],
            "webDir": "dist",
            "backgroundColor": "#071F33",
            "server": {
            "androidScheme": "https",
            "url": "https://mohammadalnablsi701-del.github.io/-aqaba-seago/${{ matrix.app }}/",
            "allowNavigation": ["mohammadalnablsi701-del.github.io"]
          }
          }
          Path("capacitor.config.json").write_text(json.dumps(config))
          PY
          npx cap add android

      - name: Add Android camera and microphone permissions for Provider
        if: matrix.app == 'provider'
        working-directory: provider-app
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          ns = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(p)
          root = tree.getroot()
          for name in ("android.permission.CAMERA", "android.permission.RECORD_AUDIO"):
              if not any(e.attrib.get(ns+"name") == name for e in root.findall("uses-permission")):
                  root.insert(0, ET.Element("uses-permission", {ns+"name": name}))
          tree.write(p, encoding="unicode", xml_declaration=True)
          PY

      - name: Generate Android icons using approved Direction A branding
        working-directory: ${{ matrix.app }}-app
        env:
          SEAGO_ICON: ${{ matrix.icon }}
          SEAGO_LABEL: ${{ matrix.app_name }} Online QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON="public/$SEAGO_ICON"
          test -s "$ICON"
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            DENSITY="${spec%%:*}"
            PIXELS="${spec##*:}"
            TARGET="android/app/src/main/res/mipmap-$DENSITY"
            mkdir -p "$TARGET"
            convert "$ICON" -resize "${PIXELS}x${PIXELS}" "$TARGET/ic_launcher.png"
            cp "$TARGET/ic_launcher.png" "$TARGET/ic_launcher_round.png"
          done
          for spec in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            DENSITY="${spec%%:*}"
            PIXELS="${spec##*:}"
            TARGET="android/app/src/main/res/mipmap-$DENSITY"
            convert "$ICON" -resize "${PIXELS}x${PIXELS}" "$TARGET/ic_launcher_foreground.png"
          done
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path=Path("android/app/src/main/res/values/strings.xml")
          content=path.read_text()
          content,count=re.subn(r'(<string name="app_name">)[^<]+(</string>)',lambda m:m.group(1)+os.environ['SEAGO_LABEL']+m.group(2),content,count=1)
          if count!=1: raise RuntimeError("App name was not set")
          path.write_text(content)
          path=Path("android/app/src/main/res/values/colors.xml")
          if path.exists():
              content=path.read_text()
              content=re.sub(r'(<color name="ic_launcher_background">)[^<]+(</color>)',r'\g<1>#071F33\g<2>',content)
              path.write_text(content)
          PY

      - name: Sync web assets and build Android debug APK
        working-directory: ${{ matrix.app }}-app
        run: |
          npx cap sync android
          node scripts/verify-build-env.mjs --dist="android/app/src/main/assets/public" --expected="https://aqaba-seago-api.onrender.com" --forbidden="https://aqaba-seago-api-staging.onrender.com" --base="./"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check APK integrity and SHA-256
        working-directory: ${{ matrix.app }}-app
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tq android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaGo-${{ matrix.app }}-Android-OnlineQA-APK
          path: ${{ matrix.app }}-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
