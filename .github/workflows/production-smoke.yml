name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for production API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            code="$(curl -sS -o /tmp/ready.json -w "%{http_code}" https://aqaba-seago-api.onrender.com/ready || true)"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 10
          done
          echo "Production API did not become ready"
          cat /tmp/ready.json || true
          exit 1

      - name: Verify Google auth config and CORS
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          curl -sS -D "$headers" -o "$body" \
            -H "Origin: https://mohammadalnablsi701-del.github.io" \
            https://aqaba-seago-api.onrender.com/api/auth/google/config
          cat "$body"
          grep -qi '^access-control-allow-origin: https://mohammadalnablsi701-del.github.io' "$headers"
          grep -q '"enabled":true' "$body"
          grep -q '764739593570-ls3m81l4defks40st7e4ejrkci98q4m5.apps.googleusercontent.com' "$body"

      - name: Verify hostile browser origins are not allowed
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS -D "$headers" -o /tmp/hostile-origin-body.json \
            -H "Origin: https://evil.example" \
            https://aqaba-seago-api.onrender.com/health
          if grep -qi '^access-control-allow-origin:' "$headers"; then
            echo "Production incorrectly allowed an untrusted browser origin"
            cat "$headers"
            exit 1
          fi

      - name: Verify production security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null https://aqaba-seago-api.onrender.com/health
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^x-frame-options: SAMEORIGIN' "$headers"
          grep -qi '^referrer-policy: no-referrer' "$headers"
          grep -qi '^x-dns-prefetch-control: off' "$headers"
          grep -qi '^x-download-options: noopen' "$headers"
          grep -qi '^x-permitted-cross-domain-policies: none' "$headers"
          grep -qi '^strict-transport-security: .*max-age=' "$headers"
          if grep -qi '^x-powered-by:' "$headers"; then
            echo "Production exposed the Express X-Powered-By fingerprint"
            cat "$headers"
            exit 1
          fi

      - name: Verify public app pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://mohammadalnablsi701-del.github.io/-aqaba-seago"
          for path in "/" "/provider/" "/admin/"; do
            code="$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$base$path")"
            echo "$path -> $code"
            test "$code" = "200"
            grep -qi '<!doctype html' /tmp/page.html
          done

      - name: Verify deployed commit versions
        shell: bash
        run: |
          set -euo pipefail
          expected_api="$(git log -1 --format=%H -- src package.json package-lock.json)"
          expected_pages="$(git log -1 --format=%H -- customer-app provider-app admin-app .github/workflows/pages.yml)"
          for i in {1..24}; do
            api_commit="$(curl -fsS https://aqaba-seago-api.onrender.com/health | node -pe 'JSON.parse(fs.readFileSync(0,"utf8")).commit||""' || true)"
            page_commit="$(curl -fsS https://mohammadalnablsi701-del.github.io/-aqaba-seago/version.json | node -pe 'JSON.parse(fs.readFileSync(0,"utf8")).commit||""' || true)"
            echo "API required:   $expected_api"
            echo "API deployed:   $api_commit"
            echo "Pages required: $expected_pages"
            echo "Pages deployed: $page_commit"
            api_ok=false
            pages_ok=false
            if [ -n "$api_commit" ] && git cat-file -e "$api_commit^{commit}" 2>/dev/null && git merge-base --is-ancestor "$expected_api" "$api_commit"; then
              api_ok=true
            fi
            if [ -n "$page_commit" ] && git cat-file -e "$page_commit^{commit}" 2>/dev/null && git merge-base --is-ancestor "$expected_pages" "$page_commit"; then
              pages_ok=true
            fi
            if [ "$api_ok" = true ] && [ "$pages_ok" = true ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not converge to expected commits"
          exit 1

      - name: Verify production API endpoints are reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://aqaba-seago-api.onrender.com/health | grep -q '"ok":true'
          curl -fsS https://aqaba-seago-api.onrender.com/api/trips > /tmp/trips.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/trips.json","utf8")); if(!Array.isArray(x)) process.exit(1); console.log("Public trips:",x.length)'
