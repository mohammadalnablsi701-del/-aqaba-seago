name: Task 5 Supply Chain Bootstrap

on:
  push:
    branches:
      - feature/final-hardening-task5-reproducible-backend-supply-chain

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/final-hardening-task5-reproducible-backend-supply-chain
          fetch-depth: 0

      - name: Setup exact Backend Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Pin Backend runtime and generate root lockfile
        shell: bash
        run: |
          set -euo pipefail
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.engines={...(p.engines||{}),node:"20.20.2"};fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          node -e 'const p=require("./package-lock.json");if(p.lockfileVersion!==3)throw new Error("Unexpected lockfileVersion "+p.lockfileVersion);console.log("lockfileVersion="+p.lockfileVersion)'

      - name: Validate two clean installs and backend tests
        shell: bash
        run: |
          set -euo pipefail
          lock_before="$(sha256sum package-lock.json)"
          rm -rf node_modules
          npm ci --no-fund
          npm test
          npm ls --depth=0 --json > "$RUNNER_TEMP/tree-1.json"
          test "$lock_before" = "$(sha256sum package-lock.json)"
          rm -rf node_modules
          npm ci --no-fund
          npm test
          npm ls --depth=0 --json > "$RUNNER_TEMP/tree-2.json"
          test "$lock_before" = "$(sha256sum package-lock.json)"
          node -e 'const fs=require("node:fs"),c=require("node:crypto");function t(f){const x=JSON.parse(fs.readFileSync(f,"utf8"));return Object.entries(x.dependencies||{}).map(([n,v])=>n+"@"+v.version).sort().join("\n")}const a=t(process.argv[1]),b=t(process.argv[2]);console.log("tree-sha256="+c.createHash("sha256").update(a).digest("hex"));if(a!==b)process.exit(1)' "$RUNNER_TEMP/tree-1.json" "$RUNNER_TEMP/tree-2.json"
          npm audit --audit-level=high
          git diff --check -- package.json package-lock.json

      - name: Commit dependency contract only
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Dependency contract already committed"
            exit 0
          fi
          git commit -m "Add deterministic Backend dependency lock"
          git push origin HEAD:feature/final-hardening-task5-reproducible-backend-supply-chain
