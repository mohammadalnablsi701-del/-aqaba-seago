name: Customer Ticket Lifecycle Truth

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  customer-ticket-lifecycle-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Run lifecycle and PDF unit regressions
        run: node --test test/customer-ticket-lifecycle.test.js test/ticket-pdf.test.js
      - name: Install disposable MongoDB replica set runner
        run: npm install --prefix "$RUNNER_TEMP/seago-mongo" mongodb-memory-server@11.3.0 --no-audit --no-fund
      - name: Run lifecycle parity and provider check-in regressions
        run: |
          node <<'JS'
          const { MongoMemoryReplSet } = require(process.env.RUNNER_TEMP + '/seago-mongo/node_modules/mongodb-memory-server');
          const { spawn } = require('node:child_process');
          (async () => {
            const db = await MongoMemoryReplSet.create({ replSet: { count: 1, storageEngine: 'wiredTiger' } });
            let code = 1;
            try {
              const child = spawn(process.execPath, [
                '--test',
                'test/customer-ticket-lifecycle.integration.test.js',
                'test/ticket-checkin.integration.test.js'
              ], {
                env: { ...process.env, SEAGO_TEST_MONGODB_URI: db.getUri() },
                stdio: 'inherit'
              });
              code = await new Promise((resolve, reject) => {
                child.on('exit', resolve);
                child.on('error', reject);
              });
            } finally {
              await db.stop();
            }
            process.exit(code ?? 1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
