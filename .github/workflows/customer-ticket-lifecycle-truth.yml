name: Customer Ticket Lifecycle Truth

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  customer-ticket-lifecycle-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install backend dependencies from lockfile
        run: npm ci
      - name: Run lifecycle and PDF unit regressions
        run: node --test test/customer-ticket-lifecycle.test.js test/ticket-pdf.test.js
      - name: Run lifecycle parity and provider check-in regressions
        run: |
          npm run test:db -- test/customer-ticket-lifecycle.integration.test.js test/ticket-checkin.integration.test.js
